<text x="38" y="778" font-size="12" text-anchor="start" fill="#000">Decisiones por RNF: RNF-03 disponibilidad 99,8 % → 2 instancias de la API tras el balanceador y réplica de BD en espera · RNF-02 seguridad en tránsito → TLS 1.3 terminado en Nginx y TLS a la BD ·</text>
<text x="38" y="793" font-size="12" text-anchor="start" fill="#000">RNF-05 500 peticiones/s → API sin estado (JWT) escalable horizontalmente · RNF-10 contingencia offline → la PWA guarda hasta 2.000 validaciones en IndexedDB y sincroniza al volver la red.</text>
<text x="20" y="868" font-size="11.5" fill="#555">8 nodos · protocolo y puerto en cada conexión</text>
